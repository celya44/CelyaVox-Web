                    + '.sidepanel .toggle-switch input:checked ~ .toggle-label{color:var(--sp-toggle-label-on);font-weight:500;}\n';
                document.head.appendChild(css);
            })();

            openPanel('Fonctions avancées', '<div style="padding:12px;">Chargement…</div>', 'functions');

            function buildAdvancedFallbackHtml(message){
                return ''
                    + '<div style="padding:12px;">'
                    +   '<div style="margin-bottom:12px;">'
                    +       '<button type="button" class="sp-button-surface" style="width:100%; padding:10px 12px; border-radius:8px; text-align:left; font-size:14px; line-height:18px;" onclick="try{ ShowMyProfile ? ShowMyProfile() : null; }catch(e){ console.warn(e); }">'
                    +           '<span class="sp-section-title" style="font-size:14px; line-height:18px;">Configurer l\'extension</span>'
                    +       '</button>'
                    +   '</div>'
                    +   (message ? '<div class="sp-error" style="padding:8px 0;">' + escHtml(message) + '</div>' : '')
                    + '</div>';
            }

            domain = normalizeApiDomain(domain);

            var base = normalizeApiUrl(localStorage.getItem('ForwardDetailUrl')) || (domain + '/celyavox-api/forward/forward_detail');
            var u;
            try{
                u = new URL(base, window.location.origin);
                if(apiExt) u.searchParams.set('extension', apiExt);
                if(apiKey) u.searchParams.set('api_key', apiKey);
            }catch(e){
                contentEl.innerHTML = buildAdvancedFallbackHtml('URL invalide pour forward_detail.');
                return;
            }

            function strToBool(v){
                if(typeof v === 'boolean') return v;
                if(v == null) return false;
                if(typeof v === 'number') return v !== 0;
                var s = String(v).trim().toLowerCase();
                if(s === '') return false;
                var truthy = ['1','true','on','enabled','enable','active','yes','y'];
                var falsy  = ['0','false','off','disabled','disable','inactive','no','n'];
                if(truthy.indexOf(s) !== -1) return true;
                if(falsy.indexOf(s)  !== -1) return false;
                // Par défaut: toute chaîne non vide qui n'est pas explicitement falsy est considérée false ici (conservateur)
                return false;
            }

            function extractForwardState(payload){
                // Accepte { data: {...} } ou data en JSON string
                var data = (payload && (payload.data != null ? payload.data : payload.Data)) || payload || {};
                try{ if(typeof data === 'string'){ data = JSON.parse(data); } }catch(e){}
                var obj = (data && typeof data === 'object') ? data : {};

                // DND: chercher un booléen/flag plausible
                var dnd = false;
                var dndKeys = ['dnd','DND','do_not_disturb','dnd_enabled','dnd_status','is_dnd','enable_dnd'];
                for(var i=0;i<dndKeys.length;i++){
                    var k = dndKeys[i];
                    if(Object.prototype.hasOwnProperty.call(obj,k)){
                        dnd = strToBool(obj[k]);
                        break;
                    }
                }

                // CF enabled + number
                var cfEnabled = false;
                var cfNumber = '';
                var cfEnableKeys = ['cf','CF','call_forward','call_forwarding','cfu_enabled','cf_enabled','call_forward_unconditional','forward_active'];
                var cfNumberKeys = ['cf_number','cfu_number','forward_number','number','destination','to','phone'];
                for(var j=0;j<cfEnableKeys.length;j++){
                    var kk = cfEnableKeys[j];
                    if(Object.prototype.hasOwnProperty.call(obj,kk)){
                        cfEnabled = strToBool(obj[kk]);
                        break;
                    }
                }
                for(var t=0;t<cfNumberKeys.length;t++){
                    var nk = cfNumberKeys[t];
                    if(Object.prototype.hasOwnProperty.call(obj,nk)){
                        var nv = obj[nk];
                        if(nv != null){ cfNumber = String(nv); break; }
                    }
                }
                // Règle demandée: le toggle CF est actif (vert) si et seulement si le numéro n'est pas vide
                try{
                    var trimmed = String(cfNumber || '').trim();
                    cfEnabled = trimmed.length > 0;
                }catch(e){}
                return { dnd: dnd, cfEnabled: cfEnabled, cfNumber: cfNumber, raw: obj };
            }

            fetch(u.toString(), { method:'GET' })
                .then(function(res){
                    if(!res.ok) throw new Error('HTTP ' + res.status);
                    var ct = res.headers.get('content-type') || '';
                    if(ct.indexOf('application/json') !== -1) return res.json();
                    return res.text().then(function(t){ try{ return JSON.parse(t); }catch(e){ return { data: t }; } });
                })
                .then(function(js){
                    var state = extractForwardState(js || {});
                    
                    // Récupérer les flags UI courants (relit depuis celyavoxConfig)
                    var uiFlags = typeof window.getUIFlags === 'function' ? window.getUIFlags() : { disableDoNotDisturb: false, disableCallForward: false };
                    
                    // Construire les blocs conditionnellement basé sur les paramètres de désactivation
                    // NOTE: On construit TOUJOURS les blocs (pas de condition ternaire), mais on les ajoute une classe pour les masquer si nécessaire
                    var dndBlockStyle = (uiFlags.disableDoNotDisturb) ? 'display:none;' : '';
                    var dndBlock = '<div id="dndBlockContainer" class="dndBlockContainer" style="' + dndBlockStyle + '">'
                        + '<div class="sp-card" style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;">'
                        +   '<div>'
                        +       '<div style="font-weight:500;">Ne pas déranger (DND)</div>'
                        +       '<div class="sp-muted" style="font-size:12px;">Empêche la sonnerie et les appels entrants.</div>'
                        +   '</div>'
                        +   '<label class="toggle-switch" aria-label="DND" role="switch">'
                        +       '<input id="toggleDnd" type="checkbox" '+ (state.dnd ? 'checked' : '') +' />'
                        +       '<span class="slider" aria-hidden="true"></span>'
                        +       '<span class="toggle-label">Actif</span>'
                        +   '</label>'
                        + '</div>'
                        + '</div>';
                    
                    var cfuBlockStyle = (uiFlags.disableCallForward) ? 'display:none;' : '';
                    var cfuBlock = '<div id="cfuBlockContainer" class="cfuBlockContainer" style="' + cfuBlockStyle + '">'
                        + '<div class="sp-card">'
                        +   '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;">'
                        +       '<div>'
                        +           '<div style="font-weight:500;">Renvoi d\'appel (CFU)</div>'
                        +           '<div class="sp-muted" style="font-size:12px;">Transfère tous les appels vers un numéro.</div>'
                        +       '</div>'
                        +       '<label class="toggle-switch" aria-label="CFU" role="switch">'
                        +           '<input id="toggleCf" type="checkbox" '+ (state.cfEnabled ? 'checked' : '') +' />'
                        +           '<span class="slider" aria-hidden="true"></span>'
                        +           '<span class="toggle-label">Actif</span>'
                        +       '</label>'
                        +   '</div>'
                        +   '<div>'
                        +       '<label for="cfNumber" class="sp-label">Numéro de renvoi</label>'
                        +       '<input id="cfNumber" type="text" value="'+ escHtml(state.cfNumber || '') +'" class="sp-input" />'
                        +   '</div>'
                        + '</div>'
                        + '</div>';
                    
                    var html = ''
                        + '<div style="padding:12px;">'
                        +   '<div style="margin-bottom:12px;">'
                        +       '<button type="button" class="sp-button-surface" style="width:100%; padding:10px 12px; border-radius:8px; text-align:left; font-size:14px; line-height:18px;" onclick="try{ ShowMyProfile ? ShowMyProfile() : null; }catch(e){ console.warn(e); }">'
                        +           '<span class="sp-section-title" style="font-size:14px; line-height:18px;">Configurer l\'extension</span>'
                        +       '</button>'
                        +   '</div>'
                        +   '<div class="sp-section-title" style="margin-bottom:12px;">Paramètres de ligne</div>'
                        +   dndBlock
                        +   cfuBlock
                        +   '<div id="advancedMsg" class="sp-muted" style="margin-top:6px; font-size:12px;"></div>'
                        + '</div>';

                    contentEl.innerHTML = html;
                    
                    // LOGS DE DEBUG
                    console.log(`
📋 BLOCS ADVANCED FUNCTIONS CRÉÉS:
  disableDoNotDisturb: ${uiFlags.disableDoNotDisturb}
  disableCallForward: ${uiFlags.disableCallForward}
  dndBlock HTML length: ${dndBlock.length}
  cfuBlock HTML length: ${cfuBlock.length}
  #dndBlockContainer exists: ${document.getElementById('dndBlockContainer') !== null}
  #cfuBlockContainer exists: ${document.getElementById('cfuBlockContainer') !== null}
  Display DND: ${document.getElementById('dndBlockContainer')?.style.display}
  Display CFU: ${document.getElementById('cfuBlockContainer')?.style.display}
`);
                    
                    // Appliquer les UI flags maintenant que les blocs existent
                    if (typeof window.applyUIFlagsToUI === 'function') {
                      console.log(`  Appel à applyUIFlagsToUI() après création des blocs...`);
                      setTimeout(() => {
                        window.applyUIFlagsToUI();
                      }, 50);
                    }
                    
                    try{
                        // Accessibilité: synchroniser aria-checked sur les switches
                        var dndCb = document.getElementById('toggleDnd');
                        var dndLabel = dndCb ? dndCb.closest('label.toggle-switch') : null;
                        if(dndCb && dndLabel){ dndLabel.setAttribute('aria-checked', dndCb.checked ? 'true' : 'false'); dndCb.addEventListener('change', function(){ dndLabel.setAttribute('aria-checked', dndCb.checked ? 'true' : 'false'); }); }

                        // Helper: appel API d'édition forward (GET)
                        var msgEl = document.getElementById('advancedMsg');
                        function setMsg(text, isError){
                            if(!msgEl) return;
                            msgEl.textContent = text || '';
                            msgEl.classList.toggle('sp-error', !!isError);
                            msgEl.classList.toggle('sp-muted', !isError);
                        }
                        var saving = false;
                        var needResave = false;
                        function saveForward(){
                            if(saving){ needResave = true; return; }
                            saving = true;
                            setMsg('Enregistrement…', false);
                            try{
                                var base = normalizeApiUrl(localStorage.getItem('ForwardEditUrl')) || (domain.replace(/\/$/, '') + '/celyavox-api/forward/forward_edit');
                                var u = new URL(base, window.location.origin);
                                var cfCb2 = document.getElementById('toggleCf');
                                var cfInput2 = document.getElementById('cfNumber');
                                var dndCb2 = document.getElementById('toggleDnd');
                                var cfOn = !!(cfCb2 && cfCb2.checked);
                                var cfVal = (cfInput2 && typeof cfInput2.value === 'string') ? cfInput2.value.trim() : '';
                                // Si le toggle CF est OFF, envoyer cf_number vide pour désactiver
                                var cfToSend = cfOn ? cfVal : '';
                                var dndToSend = (dndCb2 && dndCb2.checked) ? 'yes' : 'no';
                                if(apiExt) u.searchParams.set('extension', apiExt);
                                u.searchParams.set('dnd', dndToSend);
                                u.searchParams.set('cf_number', cfToSend);
                                if(apiKey) u.searchParams.set('api_key', apiKey);
                                try{ var pfx = localStorage.getItem('prefixe') || ''; if(pfx) u.searchParams.set('prefixe', pfx); }catch(e){}
                                // Désactive les switches pendant l'appel
                                try{ if(dndCb) dndCb.disabled = true; }catch(e){}
                                var cfCbLocal = document.getElementById('toggleCf');
                                try{ if(cfCbLocal) cfCbLocal.disabled = true; }catch(e){}
                                fetch(u.toString(), { method:'GET' })
                                    .then(function(res){ if(!res.ok) throw new Error('HTTP ' + res.status); return res.json().catch(function(){ return {}; }); })
                                    .then(function(){ setMsg('Enregistré.', false); })
                                    .catch(function(err){ setMsg('Erreur: ' + (err && err.message ? err.message : String(err)), true); })
                                    .finally(function(){
                                        saving = false;
                                        try{ if(dndCb) dndCb.disabled = false; }catch(e){}
                                        try{ if(cfCbLocal) cfCbLocal.disabled = false; }catch(e){}
                                        if(needResave){ needResave = false; saveForward(); }
                                    });
                            }catch(e){ saving = false; setMsg('Erreur: ' + (e && e.message ? e.message : String(e)), true); }
                        }

                        // Gérer CF: conserver la valeur du champ lors de l'extinction du toggle et permettre l'édition
                        var cfCb = document.getElementById('toggleCf');
                        var cfLabel = cfCb ? cfCb.closest('label.toggle-switch') : null;
                        var cfInput = document.getElementById('cfNumber');
                        if(cfCb && cfInput){
                            // L'input reste toujours éditable, on ne vide plus la valeur quand le toggle passe à OFF
                            cfInput.style.opacity = '1';
                            var syncAria = function(){ if(cfLabel){ cfLabel.setAttribute('aria-checked', cfCb.checked ? 'true' : 'false'); } };
                            syncAria();
                            cfCb.addEventListener('change', function(){
                                // Ne pas modifier la valeur du champ; enregistrer la nouvelle config
                                syncAria();
                                saveForward();
                                sizePanelToContent();
                            });
                            // Sauvegarder aussi quand le numéro change (debounce)
                            var debounce = function(fn, ms){ var t; return function(){ var ctx=this, args=arguments; clearTimeout(t); t=setTimeout(function(){ fn.apply(ctx,args); }, ms); }; };
                            cfInput.addEventListener('input', debounce(function(){ saveForward(); }, 600));
                            cfInput.addEventListener('change', function(){ saveForward(); });
                        }

                        // DND: enregistrer sur changement
                        if(dndCb){ dndCb.addEventListener('change', function(){ saveForward(); }); }
                    }catch(e){}
                    sizePanelToContent();
                })
                .catch(function(err){
                    var msg = 'Impossible de charger les fonctions avancées (' + (err && err.message ? err.message : String(err)) + ').';
                    contentEl.innerHTML = buildAdvancedFallbackHtml(msg);
                });
        }

        function attachContentResizeObserver(){
            try{
                if(contentResizeObserver){ contentResizeObserver.disconnect(); contentResizeObserver = null; }
                if(!window.ResizeObserver) return;
                contentResizeObserver = new ResizeObserver(function(){
                    try{ sizePanelToContent(); }catch(e){}
                });
                contentResizeObserver.observe(contentEl);
            }catch(e){ /* ignore */ }
        }

        function attachRightContentResizeObserver(){
            try{
                if(rightContentResizeObserver){ rightContentResizeObserver.disconnect(); rightContentResizeObserver = null; }
                if(!window.ResizeObserver) return;
                rightContentResizeObserver = new ResizeObserver(function(){
                    try{ sizeRightPanelToContent(); }catch(e){}
                });
                rightContentResizeObserver.observe(rightContentEl);
            }catch(e){ /* ignore */ }
        }

        function openPanel(title, html, type){
            titleEl.textContent = title || "";
            contentEl.innerHTML = html || "";
            // Coller le panneau au bord gauche de #Phone
            positionPanel();
            if(!type){
                var t = String(title || '').toLowerCase();
                if(/favoris/.test(t)) type = 'favorites';
                else if(/voicemail|mail/.test(t)) type = 'voicemail';
                else if(/histori|cdr|appel/.test(t)) type = 'history';
                else if(/contact/.test(t)) type = 'contacts';
                else if(/fonction/.test(t)) type = 'functions';
                else type = 'default';
            }
            panel.setAttribute('data-type', String(type));
            sizePanelToContent();
            panel.classList.add("sidepanel--open");
            panel.setAttribute("aria-hidden", "false");
            document.body.classList.add("sidepanel-open");
            // Ajuster si la fenêtre est redimensionnée
            resizeHandler = function(){ positionPanel(); sizePanelToContent(); };
            window.addEventListener("resize", resizeHandler);
            attachContentResizeObserver();
        }
        function closePanel(){
            panel.classList.remove("sidepanel--open");
            panel.setAttribute("aria-hidden", "true");
            document.body.classList.remove("sidepanel-open");
            if(resizeHandler){
                window.removeEventListener("resize", resizeHandler);
                resizeHandler = null;
            }
            if(contentResizeObserver){ try{ contentResizeObserver.disconnect(); }catch(e){} contentResizeObserver = null; }
            // Nettoyer la position explicite (retour au CSS par défaut)
            panel.style.left = "";

        function getDashboardBuddiesRows(){

            }catch(e){

        function getFavoriteExtensions(){
            var rows = getDashboardBuddiesRows();
            var map = {};
            var out = [];
            for(var i=0;i<rows.length;i++){
                var row = rows[i] || {};
                var ext = String(row.ExtensionNumber || row.ExtNo || '').trim();
                if(!ext) continue;
                if(row.Pinned !== true) continue;
                if(map[ext]) continue;
                map[ext] = true;
                out.push(ext);
            }
            return out;
        }

        function getDashboardPostesKey(){
            var pid = localStorage.getItem('profileUserID') || 'default';
            return 'DashboardPostes_' + pid;

        function createDashboardPageId(){
            return 'p' + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36);

        function normalizeDashboardPosteItem(x){
            var ext = '';
            var name = '';
            var posX = null;
            var posY = null;
            if(x != null && typeof x === 'object'){
                ext = String(x.ext || x.extension || x.number || '').trim();
                name = String(x.name || x.displayName || '').trim();
                var nx = parseInt(x.x, 10);
                var ny = parseInt(x.y, 10);
                if(isFinite(nx)) posX = nx;
                if(isFinite(ny)) posY = ny;
            } else {
                ext = String(x || '').trim();
            }
            if(!ext) return null;
            return { ext: ext, name: name, x: posX, y: posY };
        }

        function normalizeDashboardState(raw){
            var state = raw;
            if(Array.isArray(state)){
                // Backward compatibility: old format was a simple array of extensions.
                state = {
                    activeId: 'p-default',
                    pages: [
                        {
                            id: 'p-default',
                            name: 'Page 1',
                            postes: state
                        }
                    ]
                };
            }
            if(!state || typeof state !== 'object') state = {};
            if(!Array.isArray(state.pages) || state.pages.length === 0){
                state.pages = [{ id: 'p-default', name: 'Page 1', postes: [] }];
            }
            state.pages = state.pages.map(function(p, idx){
                var id = (p && p.id) ? String(p.id) : ('p-' + idx);
                var name = (p && p.name != null) ? String(p.name) : ('Page ' + (idx + 1));
                var arr = (p && Array.isArray(p.postes)) ? p.postes : [];
                var uniq = {};
                var postes = [];
                arr.forEach(function(x){
                    var it = normalizeDashboardPosteItem(x);
                    if(!it || uniq[it.ext]) return;
                    uniq[it.ext] = true;
                    postes.push(it);
                });
                return { id: id, name: name, postes: postes };
            });
            var hasActive = false;
            for(var i=0;i<state.pages.length;i++){
                if(state.pages[i].id === state.activeId){ hasActive = true; break; }
            }
            if(!hasActive) state.activeId = state.pages[0].id;
            return state;
        }

        function getDashboardState(){
            try{
                var raw = localStorage.getItem(getDashboardPostesKey());
                var parsed = raw ? JSON.parse(raw) : null;
                return normalizeDashboardState(parsed);
            }catch(e){
                return normalizeDashboardState(null);
            }
        }

        function saveDashboardState(state){
            try{ localStorage.setItem(getDashboardPostesKey(), JSON.stringify(normalizeDashboardState(state))); }catch(e){}
        }

        function getActiveDashboardPage(){
            var state = getDashboardState();
            for(var i=0;i<state.pages.length;i++){
                if(state.pages[i].id === state.activeId) return state.pages[i];
            }
            return state.pages[0];
        }

        function getDashboardPostes(){
            var page = getActiveDashboardPage();
            return (page && Array.isArray(page.postes)) ? page.postes.map(function(x){ return normalizeDashboardPosteItem(x); }).filter(Boolean) : [];
        }

        function saveDashboardPostes(list){
            var state = getDashboardState();
            var sanitized = [];
            var uniq = {};
            (Array.isArray(list) ? list : []).forEach(function(x){
                var it = normalizeDashboardPosteItem(x);
                if(!it || uniq[it.ext]) return;
                uniq[it.ext] = true;
                sanitized.push(it);
            });
            for(var i=0;i<state.pages.length;i++){
                if(state.pages[i].id === state.activeId){
                    state.pages[i].postes = sanitized;
                    break;
                }
            }
            saveDashboardState(state);
        }

        function removeDashboardPosteByExt(ext){
            var e = String(ext || '').trim();
            if(!e) return;
            var postes = getDashboardPostes().filter(function(x){ return String(x.ext || '') !== e; });
            saveDashboardPostes(postes);
        }

        function updateDashboardPoste(oldExt, nextExt, nextName){
            var oldE = String(oldExt || '').trim();
            var newE = String(nextExt || '').trim();
            var newN = String(nextName || '').trim();
            if(!oldE || !newE) return false;
            var postes = getDashboardPostes();
            var idx = -1;
            for(var i=0;i<postes.length;i++){
                if(String(postes[i].ext || '') === oldE){ idx = i; break; }
            }
            if(idx === -1) return false;
            for(var j=0;j<postes.length;j++){
                if(j === idx) continue;
                if(String(postes[j].ext || '') === newE) return false;
            }
            postes[idx] = { ext: newE, name: newN, x: postes[idx].x, y: postes[idx].y };
            saveDashboardPostes(postes);
            return true;
        }

            var sz = getDashboardCardSize();
            if(sz === 'S'){

        function clampDashboardCardPos(x, y, listWidth){
            var m = getDashboardCardMetrics();
            var safeW = Math.max(180, parseInt(listWidth, 10) || 0);
            var maxX = Math.max(m.pad, safeW - m.cardW - m.pad);
            var cx = parseInt(x, 10);
            var cy = parseInt(y, 10);
            if(!isFinite(cx)) cx = m.pad;
            if(!isFinite(cy)) cy = m.pad;
            // Snap to a regular grid so cards line up visually.
            cx = m.pad + Math.round((cx - m.pad) / m.grid) * m.grid;
            cy = m.pad + Math.round((cy - m.pad) / m.grid) * m.grid;
            if(cx < m.pad) cx = m.pad;
            if(cy < m.pad) cy = m.pad;
            if(cx > maxX) cx = maxX;
            return { x: cx, y: cy };
        }

        function getDashboardNextCardPos(postes, listWidth){
            var m = getDashboardCardMetrics();
            var safeW = Math.max(180, parseInt(listWidth, 10) || 0);
            var cols = Math.max(1, Math.floor((safeW - (m.pad * 2) + m.gap) / (m.cardW + m.gap)));
            var idx = Array.isArray(postes) ? postes.length : 0;
            var x = m.pad + ((idx % cols) * (m.cardW + m.gap));
            var y = m.pad + (Math.floor(idx / cols) * (m.cardH + m.gap));
            return clampDashboardCardPos(x, y, safeW);
        }

        function relayoutDashboardPostes(){
            var postes = getDashboardPostes();
            if(!Array.isArray(postes) || postes.length === 0) return;
            var listEl = rightContentEl ? rightContentEl.querySelector('#dashboard-postes-list') : null;
            var listWidth = listEl
                ? Math.floor(listEl.clientWidth || 0)
                : Math.floor(((rightContentEl && rightContentEl.clientWidth) || 284) - 24);
            if(!isFinite(listWidth) || listWidth < 180) listWidth = 260;

            var out = [];
            for(var i=0;i<postes.length;i++){
                var item = postes[i] || {};
                var ext = String(item.ext || '').trim();
                if(!ext) continue;
                var pos = getDashboardNextCardPos(out, listWidth);
                out.push({ ext: ext, name: String(item.name || ''), x: pos.x, y: pos.y });
            }
            saveDashboardPostes(out);
        }

        function moveDashboardPosteTo(ext, x, y, listWidth){
            var e = String(ext || '').trim();
            if(!e) return false;
            var postes = getDashboardPostes();
            var pos = clampDashboardCardPos(x, y, listWidth);
            var found = false;
            for(var i=0;i<postes.length;i++){
                if(String(postes[i].ext || '') !== e) continue;
                postes[i] = { ext: postes[i].ext, name: postes[i].name, x: pos.x, y: pos.y };
                found = true;
                break;
            }
            if(!found) return false;
            saveDashboardPostes(postes);
            return true;
        }

        function mapBlfDotClass(buddyObj){
            if(!buddyObj) return 'dotOffline';
            var dev = String(buddyObj.devState || '').toUpperCase();
            if(dev === 'INUSE' || dev === 'ONHOLD' || dev === 'BUSY') return 'dotInUse';
            if(dev === 'RINGING' || dev === 'RINGINUSE') return 'dotRinging';
            if(dev === 'HOLD') return 'dotOnHold';
            if(dev === 'NOT_INUSE' || dev === 'UNAVAILABLE' || dev === 'UNKNOWN'){
                // keep checking presence below
            }
            var presence = String(buddyObj.presence || '').toLowerCase();
            if(presence.indexOf('ring') !== -1) return 'dotRinging';
            if(presence.indexOf('hold') !== -1) return 'dotOnHold';
            if(presence.indexOf('phone') !== -1 || presence.indexOf('proceed') !== -1) return 'dotInUse';
            if(presence.indexOf('ready') !== -1) return 'dotOnline';
            if(presence.indexOf('not online') !== -1 || presence.indexOf('unavailable') !== -1) return 'dotOffline';
            if(dev === 'NOT_INUSE') return 'dotOnline';
            return 'dotOffline';
        }

        function findBuddyForExt(ext){
            var rows = getDashboardBuddiesRows();
            var identity = '';
            for(var i=0;i<rows.length;i++){
                var row = rows[i] || {};
                var rowExt = String(row.ExtensionNumber || row.ExtNo || '').trim();
                if(rowExt !== ext) continue;
                identity = String(row.uID || row.cID || row.gID || '').trim();
                if(identity) break;
            }
            if(!identity || typeof window.FindBuddyByIdentity !== 'function') return null;
            try{ return window.FindBuddyByIdentity(identity); }catch(e){ return null; }
        }

        function renderDashboardPostes(){
            if(!rightContentEl) return;
            var listEl = rightContentEl.querySelector('#dashboard-postes-list');
            if(!listEl) return;
            var filterInput = (rightPanel || rightContentEl).querySelector('#dashboard-card-filter');
            var filterText = String((filterInput && filterInput.value) || '').trim().toLowerCase();
            var postes = getDashboardPostes();
            var gm = getDashboardCardMetrics();
            listEl.style.position = 'relative';
            listEl.style.display = 'block';
            listEl.style.paddingBottom = '4px';
            listEl.style.backgroundImage = '';
            listEl.style.backgroundSize = '';
            listEl.style.backgroundPosition = '';
            listEl.style.borderRadius = '';
            if(postes.length === 0){
                listEl.style.height = '140px';
                listEl.innerHTML = "<div class='sp-muted' style='padding:6px 0;'>Aucun poste. Utilisez le bouton + pour en ajouter.</div>";
                return;
            }
            var m = gm;
            var listWidth = Math.max(180, Math.floor(listEl.clientWidth || (rightContentEl.clientWidth - 24) || 260));
            var html = "";
            var maxBottom = m.pad;
            var needSave = false;
            var postesOut = [];
            var shown = 0;
            for(var i=0;i<postes.length;i++){
                var item = postes[i] || {};
                var ext = String(item.ext || '').trim();
                if(!ext) continue;
                var pos = clampDashboardCardPos(item.x, item.y, listWidth);
                if(!isFinite(parseInt(item.x, 10)) || !isFinite(parseInt(item.y, 10))){
                    pos = getDashboardNextCardPos(postesOut, listWidth);
                    needSave = true;
                }
                postesOut.push({ ext: ext, name: String(item.name || ''), x: pos.x, y: pos.y });
                var buddy = findBuddyForExt(ext);
                var dot = mapBlfDotClass(buddy);
                var displayName = String(item.name || (buddy && (buddy.CallerIDName || buddy.DisplayName)) || '');
                if(filterText){
                    var extRaw = String(ext || '').toLowerCase();
                    var extShown = String(dashboardStripPrefix(ext) || '').toLowerCase();
                    var nameShown = String(displayName || '').toLowerCase();
                    var match = (extRaw.indexOf(filterText) !== -1)
                             || (extShown.indexOf(filterText) !== -1)
                             || (nameShown.indexOf(filterText) !== -1);
                    if(!match) continue;
                }
                var btm = pos.y + m.cardH;

        function reorderDashboardPostes(dragExt, targetExt, placeAfter){
            var drag = String(dragExt || '').trim();
            var target = String(targetExt || '').trim();
            if(!drag) return;
            var postes = getDashboardPostes();
            var from = -1;
            for(var fi=0;fi<postes.length;fi++){ if(String(postes[fi].ext||'') === drag){ from = fi; break; } }
            if(from === -1) return;
            var draggedItem = postes.splice(from, 1)[0];
            if(!target){
                postes.push(draggedItem);
            } else {
                var to = -1;
                for(var ti=0;ti<postes.length;ti++){ if(String(postes[ti].ext||'') === target){ to = ti; break; } }
                if(to === -1){
                    postes.push(draggedItem);
                } else {
                    if(placeAfter === true) to = to + 1;
                    postes.splice(to, 0, draggedItem);
                }
            }
            saveDashboardPostes(postes);
            renderDashboardPostes();
        }

        function dashboardSearchContactsApi(q){
            q = (q||'').trim();
            try{
                var domain = getCfg(["SipDomain","SipDomaine"]);
                domain = normalizeApiDomain(domain);
                var base = normalizeApiUrl(localStorage.getItem('ContactSearchUrl')) || (domain + '/celyavox-api/ldap/contacts');
                var u = new URL(base, window.location.origin);
                u.searchParams.set('sn', q);
                var apiKey = getCfg(["api_key","ApiKey","API_KEY"]);
                if(apiKey) u.searchParams.set('api_key', apiKey);
                try{ var pfx = localStorage.getItem('prefixe') || ''; if(pfx) u.searchParams.set('prefixe', pfx); }catch(e){}
                var headers = {};
                var bearer = localStorage.getItem('ContactBearer') || localStorage.getItem('LdapBearer');
                var basicUser = localStorage.getItem('ContactUser') || localStorage.getItem('LdapUser');
                var basicPass = localStorage.getItem('ContactPass') || localStorage.getItem('LdapPass');
                if(bearer){ headers['Authorization'] = 'Bearer ' + bearer; }
                else if(basicUser || basicPass){ headers['Authorization'] = 'Basic ' + btoa(String(basicUser||'') + ':' + String(basicPass||'')); }

                return fetch(u.toString(), { headers: headers })
                    .then(function(res){ return res.json(); })
                    .then(function(js){
                        var items = toArrayFromResponse(js) || [];
                        return { ok:true, items: items };
                    })
                    .catch(function(err){ return { ok:false, error: err && err.message ? err.message : String(err) }; });
            }catch(e){
                return Promise.resolve({ ok:false, error: e && e.message ? e.message : String(e) });
            }
        }

        function dashboardPickExt(it){
            // Keep numeric extension-like values; optional short-number filtering is applied in result rendering.
            function normalizeDigits(v){
                return String(v == null ? '' : v).replace(/\s+/g, '').trim();
            }
            function looksLikeExtension(v){
                var s = normalizeDigits(v);
                if(!/^\d+$/.test(s)) return false;
                var minLen = 2;
                return s.length >= minLen;
            }
            var preferred = [ it.extension, it.ext, it.internalNumber, it.sipId, it.uid ];
            for(var i=0;i<preferred.length;i++){
                if(looksLikeExtension(preferred[i])) return normalizeDigits(preferred[i]);
            }
            // Fallback on telephone field only if it still looks like a numeric extension.
            if(looksLikeExtension(it.telephoneNumber)) return normalizeDigits(it.telephoneNumber);
            return null;
        }

        function dashboardBestName(it){
            var plain = it.name || it.displayName || it.cn || ((it.givenName||'') + ' ' + (it.sn||'')) || it.dn || it.uid || '';
            return String(plain || '').trim();
        }

        function dashboardPrefix(){
            try{ return localStorage.getItem('prefixe') || ''; }catch(e){ return ''; }
        }
        function dashboardStripPrefix(ext){
            var pfx = dashboardPrefix();
            var s = String(ext || '');
            if(!pfx) return s;
            return s.indexOf(pfx) === 0 ? s.substring(pfx.length) : s;
        }
        function dashboardApplyPrefix(ext){
            var pfx = dashboardPrefix();
            var s = String(ext || '');
            if(!pfx) return s;
            return s.indexOf(pfx) === 0 ? s : (pfx + s);
        }

        function dashboardFindBuddyRowByExt(ext){
            if(!ext) return null;
            var rows = getDashboardBuddiesRows();
            var extStr = String(ext).trim();
            for(var i=0;i<rows.length;i++){
                var x = rows[i];
                if(!x) continue;
                var e = String(x.ExtensionNumber || x.ExtNo || '').trim();
                if(e !== '' && e === extStr) return x;
            }
            return null;
        }

        function dashboardEnsureBuddySubscribe(name, ext){
            if(!ext) return;
            var subscribeExt = dashboardApplyPrefix(ext);
            var row = dashboardFindBuddyRowByExt(ext);
            if(row){
                try{
                    row.Subscribe = true;
                    row.SubscribeUser = subscribeExt;
                    var pid = getCfg(['profileUserID']) || localStorage.getItem('profileUserID');
                    if(pid){
                        var raw = localDB.getItem(pid + '-Buddies');
                        var js = raw ? JSON.parse(raw) : null;
                        if(js && Array.isArray(js.DataCollection)){
                            for(var i=0;i<js.DataCollection.length;i++){
                                var rr = js.DataCollection[i];
                                if(!rr) continue;
                                var rrExt = String(rr.ExtensionNumber || rr.ExtNo || '').trim();
                                if(rrExt === String(ext).trim()){
                                    rr.Subscribe = true;
                                    rr.SubscribeUser = subscribeExt;
                                    break;
                                }
                            }
                            localDB.setItem(pid + '-Buddies', JSON.stringify(js));
                        }
                    }
                }catch(e){}
                try{ UpdateBuddyList(); }catch(e){}
                try{
                    var identity = String(row.uID || row.cID || row.gID || '');
                    if(identity && typeof FindBuddyByIdentity === 'function' && typeof SubscribeBuddy === 'function'){
                        var b = FindBuddyByIdentity(identity);
                        if(b){
                            b.EnableSubscribe = true;
                            b.SubscribeUser = subscribeExt;
                            SubscribeBuddy(b);
                        }
                    }
                }catch(e){}
                return;
            }
            try{
                var buddy = MakeBuddy('extension', true, false, true, name || ext, ext, null, false, subscribeExt, false, false);
                try{ UpdateBuddyList(); }catch(e){}
                try{ if(buddy && typeof SubscribeBuddy === 'function') SubscribeBuddy(buddy); }catch(e){}
            }catch(e){
                console.error('dashboard buddy creation error', e);
            }
        }

        function renderDashboardSearchResults(items){
            if(!rightContentEl) return;
            var root = rightPanel || rightContentEl;
            var out = root.querySelector('#dashboardResults');
            if(!out) return;
            if(!Array.isArray(items) || items.length === 0){
                out.innerHTML = "<div class='sp-muted'>Aucun résultat.</div>";
                return;
            }
            var shortOnlyEl = root.querySelector('#dashboard-short-only');
            var shortOnly = !!(shortOnlyEl && shortOnlyEl.checked);
            var postes = getDashboardPostes();
            var inMap = {};
            for(var i=0;i<postes.length;i++) inMap[String(postes[i].ext || '')] = true;
            var h = "<ul style='list-style:none; margin:0; padding:0;'>";
            var shown = 0;
            for(var j=0;j<items.length;j++){
                var it = items[j] || {};
                var ext = dashboardPickExt(it);
                if(!ext) continue;
                if(shortOnly){
                    var shortDigits = String(dashboardStripPrefix(ext)).replace(/\D+/g, '');
                    if(!shortDigits || shortDigits.length >= 6) continue;
                }
                var name = escHtml(dashboardBestName(it) || '');
                var already = inMap[ext] === true;
                var addBtn = already
                    ? "<button type='button' class='sp-button-surface' disabled style='padding:4px 8px; border-radius:6px; opacity:.6;'>Ajoute</button>"
                    : "<button type='button' class='dashboard-poste-add sp-button-add' data-ext='"+ escHtml(ext) +"' data-name='"+ name +"'><i class='fa fa-plus'></i> Ajouter</button>";
                h += "<li class='sp-item' style='padding:8px 0;'>"
                  +   "<div style='font-weight:500;'>"+ name +" <span class='sp-badge'>Ext "+ escHtml(dashboardStripPrefix(ext)) +"</span></div>"
                  +   addBtn
                  + "</li>";
                shown++;
            }
            if(shown === 0){
                out.innerHTML = shortOnly
                    ? "<div class='sp-muted'>Aucun resultat avec numero court (&lt; 6 chiffres).</div>"
                    : "<div class='sp-muted'>Aucun resultat avec extension.</div>";
                return;
            }
            h += "</ul>";
            out.innerHTML = h;
        }

                var cardRect = card.getBoundingClientRect();
                dragOffsetX = Math.round(ev.clientX - cardRect.left);
                dragOffsetY = Math.round(ev.clientY - cardRect.top);
                if(!isFinite(dragOffsetX)) dragOffsetX = 8;
                if(!isFinite(dragOffsetY)) dragOffsetY = 8;
                try{ ev.dataTransfer.setData('text/plain', dragExt); }catch(e){}
                try{ ev.dataTransfer.effectAllowed = 'move'; }catch(e){}
                card.style.opacity = '0.5';

            });

        function updateBottomMenuFromApi(){
            var domain = getCfg(["SipDomain","SipDomaine"]);
            var ext    = getCfg(["SipUsername","SipUserID","profileUserID"]) || '';
            var apiKey = getCfg(["api_key","ApiKey","API_KEY"]) || '';
            if(!domain || !ext) return;

            var vmBtn = $("nav-voicemail");
            if(vmBtn) vmBtn.style.display = 'none';
            var agentBtn = $("nav-agent");
            if(agentBtn) agentBtn.style.display = 'none';
            var dashboardBtn = $("nav-dashboard");
            if(dashboardBtn) dashboardBtn.style.display = 'none';
            var favoritesBtn = $("nav-favoris");

            var apiExt = ext;
            try{
                var s = String(ext || '');
                if(/^99\d{3}$/.test(s)) apiExt = s.substring(2);
            }catch(e){}

            domain = normalizeApiDomain(domain);

            var base = normalizeApiUrl(localStorage.getItem('MenuGetUrl')) || (domain + '/celyavox-api/menu/get_menu');
            var u;
            try{
                u = new URL(base, window.location.origin);
                if(apiExt) u.searchParams.set('extension', apiExt);
                if(apiKey) u.searchParams.set('api_key', apiKey);
                try{ var pfx = localStorage.getItem('prefixe') || ''; if(pfx) u.searchParams.set('prefixe', pfx); }catch(e){}
            }catch(e){
                console.warn('URL get_menu invalide', e);
                return;
            }

            fetch(u.toString(), { method: 'GET' })
                .then(function(res){
                    if(!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json().catch(function(){ return {}; });
                })
                .then(function(js){
                    var arr = toArrayFromResponse(js);
                    if(!Array.isArray(arr) || arr.length === 0) return;

                    var normalized = arr.map(function(it){
                        if(it == null) return '';
                        if(typeof it === 'string') return it.trim().toLowerCase();
                        if(typeof it === 'object'){
                            var v = it.name || it.label || it.title || it.menu || it.type;
                            if(v != null) return String(v).trim().toLowerCase();
                        }
                        return String(it).trim().toLowerCase();
                    }).filter(function(v){ return v !== ''; });

                    var hasVoicemail = normalized.indexOf('voicemail') !== -1;
                    var hasAgent = normalized.indexOf('agent') !== -1;
                    var hasDashboard = normalized.indexOf('dashboard') !== -1;

                    if(vmBtn) vmBtn.style.display = hasVoicemail ? '' : 'none';
                    if(agentBtn) agentBtn.style.display = hasAgent ? '' : 'none';
                    if(dashboardBtn) dashboardBtn.style.display = hasDashboard ? '' : 'none';
                    if(favoritesBtn) favoritesBtn.style.display = hasDashboard ? 'none' : '';
                    document.body.classList.toggle('has-dashboard', hasDashboard);

                    // Open dashboard by default once on startup when the menu exposes it.
                    if(hasDashboard && dashboardBtn && !dashboardAutoOpened){
                        dashboardAutoOpened = true;
                        setTimeout(function(){
                            try{ dashboardBtn.click(); }catch(e){}
                        }, 0);
                    }
                })
                .catch(function(err){
                    console.warn('get_menu échoué', err);
                });
        }

                            function pickExt(it){
                                // Keep numeric extension-like values; short-number filter is handled in renderFavResults.
                                function normalizeDigits(v){
                                    return String(v == null ? '' : v).replace(/\s+/g, '').trim();
                                }
                                function looksLikeExtension(v){
                                    var s = normalizeDigits(v);
                                    if(!/^\d+$/.test(s)) return false;
                                    var minLen = 2;
                                    return s.length >= minLen;
                                }
                                var preferred = [ it.extension, it.ext, it.internalNumber, it.sipId, it.uid ];
                                for(var i=0;i<preferred.length;i++){
                                    if(looksLikeExtension(preferred[i])) return normalizeDigits(preferred[i]);
                                }
                                // Fallback on telephone field only if it still looks like a numeric extension.
                                if(looksLikeExtension(it.telephoneNumber)) return normalizeDigits(it.telephoneNumber);
                                return null;

                                    // Bind remove buttons
                                    var remBtns = favListEl.querySelectorAll('.fav-remove');
                                    remBtns.forEach(function(btn){
                                        btn.addEventListener('click', function(){
                                            var id = btn.getAttribute('data-id') || '';
                                            if(id && typeof TogglePinned === 'function'){
                                                try{ TogglePinned(id); } catch(e){ console.error(e); }
                                                try{ UpdateBuddyList(); } catch(e){ console.error(e); }
                                                loadFavorites();
                                            }
                                        });
                                    });
                                    // Init presence indicators from current buddy states
                                    initFavPresence(pins);
                                    sizePanelToContent();
                                }catch(e){
                                    console.error('loadFavorites error', e);
                                }
                            }

                            function bindAddButtons(){
                                if(!contentEl) return;
                                var btns = contentEl.querySelectorAll('.fav-add');
                                btns.forEach(function(btn){
                                    btn.addEventListener('click', function(){
                                        var name = btn.getAttribute('data-name') || '';
                                        var ext  = btn.getAttribute('data-ext')  || '';
                                        var mobile = btn.getAttribute('data-mobile') || '';
                                        var email = btn.getAttribute('data-email') || '';
                                        if(!/^\d{2,8}$/.test(ext)){
                                            alert("Ce contact n'a pas d'extension interne valide.");
                                            return;
                                        }
                                        // Empêcher les doublons: si déjà en favoris, avertir et ne rien faire
                                        if(isExtAlreadyPinned(ext)){
                                            alert('Ce favori existe déjà.');
                                            return;
                                        }
                                        // Si le buddy existe déjà (non épinglé), ne pas le recréer: simplement l'épingler et s'assurer de l'abonnement
                                        var existingRow = findBuddyRowByExt(ext);
                                        if(existingRow){
                                            try{
                                                var identity = String(existingRow.uID || existingRow.cID || existingRow.gID || '');
                                                if(identity){
                                                    if(existingRow.Pinned !== true && typeof TogglePinned === 'function'){
                                                        try{ TogglePinned(identity); }catch(e){}
                                                    }
                                                    try{
                                                        var subscribeExt = applyPrefixForSubscribe(ext);
                                                        existingRow.Subscribe = true;
                                                        existingRow.SubscribeUser = subscribeExt;
                                                        var pid = getCfg(['profileUserID']) || localStorage.getItem('profileUserID');
                                                        if(pid){
                                                            var raw = localDB.getItem(pid + '-Buddies');
                                                            var js = raw ? JSON.parse(raw) : null;
                                                            if(js && Array.isArray(js.DataCollection)){
                                                                for(var i=0;i<js.DataCollection.length;i++){
                                                                    var row = js.DataCollection[i];
                                                                    if(!row) continue;
                                                                    var rowExt = String(row.ExtensionNumber || row.ExtNo || '').trim();
                                                                    if(rowExt === String(ext).trim()){
                                                                        row.Subscribe = true;
                                                                        row.SubscribeUser = subscribeExt;
                                                                        break;
                                                                    }
                                                                }
                                                                localDB.setItem(pid + '-Buddies', JSON.stringify(js));
                                                            }
                                                        }
                                                    }catch(e){}
                                                    try{ UpdateBuddyList(); }catch(e){}
                                                    loadFavorites();
                                                    try{
                                                        var b = (typeof FindBuddyByIdentity === 'function') ? FindBuddyByIdentity(identity) : null;
                                                        if(b){
                                                            try{
                                                                var subscribeExt = applyPrefixForSubscribe(ext);
                                                                b.EnableSubscribe = true;
                                                                b.SubscribeUser = subscribeExt;
                                                            }catch(e){}
                                                            if(typeof SubscribeBuddy === 'function'){
                                                                try{ SubscribeBuddy(b); }catch(e){}
                                                            }
                                                            try{ updateFavPresenceByBuddy(b); }catch(e){}
                                                        }
                                                    }catch(e){}
                                                }
                                            }catch(e){}
                                            // Afficher le dialpad et fermer le champ de recherche
                                            try{
                                                setTimeout(function(){
                                                    var myContacts = document.getElementById('myContacts');
                                                    var actionArea = document.getElementById('actionArea');
                                                    var favSearchZone = document.getElementById('favSearchZone');
                                                    var favHelp = document.getElementById('favHelp');
                                                    if(myContacts) myContacts.style.display = 'none';
                                                    if(actionArea) actionArea.style.display = '';
                                                    if(favSearchZone) favSearchZone.style.display = 'none';
                                                    if(favHelp) favHelp.style.display = '';
                                                }, 0);
                                            }catch(e){}
                                            return;
                                        }
                                        try{
                                            var subscribeExt = applyPrefixForSubscribe(ext);
                                            // Crée un buddy type extension avec abonnement activé
                                            var buddy = MakeBuddy('extension', true, false, true, name, ext, null, false, subscribeExt, false, false);
                                            // Épingler en favori (persistant)
                                            if(buddy && buddy.identity && typeof TogglePinned === 'function'){
                                                TogglePinned(buddy.identity);
                                            }
                                            // Mise à jour côté UI
                                            UpdateBuddyList();
                                            loadFavorites();
                                            // Mettre à jour aussitôt l'indicateur de présence si disponible
                                            try{ updateFavPresenceByBuddy(buddy); }catch(e){}
                                            // Afficher le dialpad et fermer le champ de recherche
                                            try{
                                                setTimeout(function(){
                                                    var myContacts = document.getElementById('myContacts');
                                                    var actionArea = document.getElementById('actionArea');
                                                    var favSearchZone = document.getElementById('favSearchZone');
                                                    var favHelp = document.getElementById('favHelp');
                                                    if(myContacts) myContacts.style.display = 'none';
                                                    if(actionArea) actionArea.style.display = '';
                                                    if(favSearchZone) favSearchZone.style.display = 'none';
                                                    if(favHelp) favHelp.style.display = '';
                                                }, 0);
                                            }catch(e){}
                                        }catch(e){
                                            console.error('Erreur création buddy', e);
                                            alert('Impossible de créer le favori: ' + (e && e.message ? e.message : e));
                                        }
                                    });
                                });
                            }

                            var favAddBtn = document.getElementById('favAddBtn');
                            var favZone   = document.getElementById('favSearchZone');
                            var favInput  = document.getElementById('txtFindFavorite');
                            var favRes    = document.getElementById('favResults');
                            var favLastSearchItems = [];
                            if(!favAddBtn || !favZone) return;
                            favAddBtn.addEventListener('click', function(){
                                favZone.style.display = 'block';
                                var help = document.getElementById('favHelp');
                                if(help) help.style.display = 'none';
                                if(favInput) favInput.focus();
                                sizePanelToContent();
                            });

                            var doSearchFav = debounce(function(){
                                if(!favInput || !favRes) return;
                                var q = favInput.value || '';
                                if(q.trim().length < 2){ favLastSearchItems = []; favRes.innerHTML = "<div>Saisissez au moins 2 caractères…</div>"; sizePanelToContent(); return; }
                                favRes.innerHTML = "<div><span class='fa fa-circle-o-notch fa-spin'></span> Recherche…</div>";
                                window.searchContactsApi(q).then(function(resp){
                                    if(!resp || resp.ok !== true){
                                        favRes.innerHTML = "<div class='sp-error'>"+ esc(resp && resp.error ? resp.error : 'Erreur recherche') +"</div>";
                                    } else {
                                        favLastSearchItems = resp.items || [];
                                        favRes.innerHTML = renderFavResults(favLastSearchItems);
                                        bindAddButtons();
                                    }
                                    sizePanelToContent();
                                }).catch(function(err){
                                    favRes.innerHTML = "<div class='sp-error'>"+ esc(err && err.message ? err.message : String(err)) +"</div>";
                                    sizePanelToContent();
                                });
                            }, 350);
                            if(favInput) favInput.addEventListener('input', doSearchFav);
                            var favShortOnly = document.getElementById('fav-short-only');
                            if(favShortOnly){
                                favShortOnly.addEventListener('change', function(){
                                    if(!favRes) return;
                                    if(Array.isArray(favLastSearchItems) && favLastSearchItems.length > 0){
                                        favRes.innerHTML = renderFavResults(favLastSearchItems);
                                        bindAddButtons();
                                    } else {
                                        var q = String((favInput && favInput.value) || '').trim();
                                        favRes.innerHTML = q.length < 2
                                            ? "<div>Saisissez au moins 2 caractères…</div>"
                                            : "<div>Lancez une recherche…</div>";
                                    }
                                    sizePanelToContent();
                                });
                            }
                            // Charger la liste des favoris existants dès l'ouverture
                            loadFavorites();
                            // Écouter les NOTIFY pour rafraîchir les présences des favoris
                            try{
                                window.web_hook_on_notify = function(ContentType, buddyObj, notify){
                                    try{ updateFavPresenceByBuddy(buddyObj); }catch(e){}
                                }
                            }catch(e){}
                        })();
                    } else {
                        openPanel(b.title, "<div style='padding:12px'>"+ b.title +"</div>");
                    }
                }
            });
        });

        try{ updateBottomMenuFromApi(); }catch(e){}

        // Exposer une fonction globale pour rafraîchir l'historique si ouvert
        window.refreshHistoryIfOpen = function(){
            try{
                if(panel && panel.classList.contains('sidepanel--open') && panel.getAttribute('data-type') === 'history'){
                    if(typeof loadHistory === 'function'){
                        console.log('[Historique] Rafraîchissement après raccroché');
                        loadHistory();
                    }
                }
            }catch(e){ console.error('refreshHistoryIfOpen error', e); }
        };
    })();
    </script>
